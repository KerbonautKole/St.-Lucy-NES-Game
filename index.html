<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Lucy's NES Game</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        /* Lock layout bounds cleanly */
        .game-wrapper {
            width: 640px;
            height: 480px;
            max-width: 100%;
            margin: 0 auto;
            border: 4px solid #333;
            background: black;
            position: relative;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>St. Lucy's Home for Girls Raised by Wolves: The NES Game</h1>
    
    <div class="game-wrapper">
        <div id="game"></div>
    </div>

       <script type="text/javascript">

         try {
            // EmulatorJS stores active settings inside 'retroarch-options'
            let raOptions = localStorage.getItem('retroarch-options');
            
            // If it doesn't exist yet, create a default blank object structure
            raOptions = raOptions ? JSON.parse(raOptions) : {};

            // Inject the zero-mask variables directly into the simulated core settings
            raOptions["nestopia_overscan_v_top"] = "0";
            raOptions["nestopia_overscan_v_bottom"] = "0";
            raOptions["nestopia_overscan_h"] = "0";

            // Save our forced configuration straight back into the browser's hardware memory
            localStorage.setItem('retroarch-options', JSON.stringify(raOptions));
        } catch (e) {
            console.error("Cache injection failed:", e);
        }

        // Global configuration variables 
        EJS_player = '#game';
        EJS_core = 'nestopia';
        EJS_gameUrl = 'game.nes'; // Ensure 'game.nes' is committed to your main repository folder
        
        // Correct CDN data path (Requires a trailing slash)
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; 
        
    </script>
    
    <!-- Correct script source URL -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>


</body>
</html>
