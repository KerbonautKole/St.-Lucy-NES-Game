<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play My NES Game (Full Frame)</title>
    <script type="text/javascript" src="https://unpkg.com"></script>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        
        #nes-container {
            box-sizing: border-box; 
            width: 512px;
            height: 480px;
            margin: 0 auto;
            border: 4px solid #333;
            background: black;
            overflow: hidden;
        }

        #nes-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .controls {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>My Full-Frame NES Hack</h1>
    
    <div id="nes-container">
        <canvas id="nes-canvas" width="256" height="240"></canvas>
    </div>

    <div class="controls">
        <p><strong>Controls:</strong> D-Pad = Arrow Keys | A = X | B = Z | Select = Right Shift | Start = Enter</p>
    </div>

    <script>
        window.onload = function () {
            var canvas = document.getElementById("nes-canvas");
            var ctx = canvas.getContext("2d");
            

            var imageData = ctx.createImageData(256, 240);
            var buf32 = new Uint32Array(imageData.data.buffer);


            var nes = new jsnes.NES({
                onFrame: function(buffer) {
    
                    var i = 0;
                    for (var y = 0; y < 240; y++) {
                        for (var x = 0; x < 256; x++) {
                            var color = buffer[i++];
                    
                            buf32[y * 256 + x] = 0xFF000000 | color;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                },
                onAudioSample: function(left, right) {
   
                }
            });

            var KEYS = {
                38: jsnes.Controller.BUTTON_UP,      // Arrow Up
                40: jsnes.Controller.BUTTON_DOWN,    // Arrow Down
                37: jsnes.Controller.BUTTON_LEFT,    // Arrow Left
                39: jsnes.Controller.BUTTON_RIGHT,   // Arrow Right
                88: jsnes.Controller.BUTTON_A,       // X Key
                90: jsnes.Controller.BUTTON_B,       // Z Key
                16: jsnes.Controller.BUTTON_SELECT,  // Right Shift
                13: jsnes.Controller.BUTTON_START    // Enter
            };

            window.addEventListener("keydown", function(e) {
                if (KEYS[e.keyCode] !== undefined) {
                    nes.buttonDown(1, KEYS[e.keyCode]);
                    e.preventDefault();
                }
            });

            window.addEventListener("keyup", function(e) {
                if (KEYS[e.keyCode] !== undefined) {
                    nes.buttonUp(1, KEYS[e.keyCode]);
                    e.preventDefault();
                }
            });


            fetch("game.nes")
                .then(response => response.arrayBuffer())
                .then(buffer => {
                    var binary = "";
                    var bytes = new Uint8Array(buffer);
                    for (var i = 0; i < bytes.byteLength; i++) {
                        binary += String.fromCharCode(bytes[i]);
                    }
                    
  
                    nes.loadROM(binary);

                    setInterval(nes.frame, 1000 / 60);
                })
                .catch(err => console.error("Error loading ROM file:", err));
        };
    </script>

</body>
</html>
