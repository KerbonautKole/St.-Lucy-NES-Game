<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play My NES Game (Full Sound & Frame)</title>
    <!-- Load JSNES from CDN -->
    <script type="text/javascript" src="https://unpkg.com"></script>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* 1. Container framework utilizing modern aspect ratios to prevent clipping */
        #nes {
            box-sizing: border-box;
            width: 100%;
            max-width: 512px; /* 256 NES pixels * 2 */
            aspect-ratio: 256 / 240; /* Forces exact native NES layout grid proportions */
            margin: 0 auto;
            border: 4px solid #333;
            background: black;
            position: relative;
            overflow: visible !important; /* Forces hidden edge layers to show */
        }

        /* 2. Target the canvas generated by JSNES and strip any hardcoded clipping */
        #nes canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
            image-rendering: pixelated; /* Keeps standard pixels sharp */
            image-rendering: crisp-edges;
            box-sizing: border-box !important;
        }

        .controls {
            margin-top: 25px;
            font-size: 14px;
            color: #aaa;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>My Full-Frame NES Hack</h1>
    
    <!-- JSNES wrapper inserts its audio handlers and screen canvas right here -->
    <div id="nes"></div>

    <div class="controls">
        <p>🎵 <em>Note: Browsers block sound until you click anywhere on the page!</em></p>
        <p><strong>Controls:</strong> D-Pad = Arrow Keys | A = X | B = Z | Select = Right Shift | Start = Enter</p>
    </div>

    <script>
        window.onload = function () {
            // Re-initialize the official wrapper to restore sound engineering
            var browser = new jsnes.Browser({
                container: document.getElementById("nes"),
                onError: function (e) {
                    console.error("Emulator Exception Matrix:", e);
                },
            });

            // Automatically load and stream your exact ROM file
            jsnes.Browser.loadROMFromURL("game.nes", function (err, data) {
                if (err) {
                    console.error("Failed to parse local game file:", err);
                    return;
                }
                browser.loadROM(data);
            });
        };
    </script>

</body>
</html>
