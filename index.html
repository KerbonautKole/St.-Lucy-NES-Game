<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Lucy's NES Game</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        /* Wrap the player to force perfect 4:3 integer scaling blocks */
        .game-wrapper {
            width: 640px;
            height: 480px;
            max-width: 100%;
            margin: 0 auto;
            border: 4px solid #333;
            background: black;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>St. Lucy's Home for Girls Raised by Wolves: The NES Game</h1>
    
    <div class="game-wrapper">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        // EmulatorJS Global Configuration Options
        EJS_player = '#game';
        EJS_core = 'nes'; // Loads the optimized RetroArch NES core
        EJS_gameUrl = 'game.nes'; // Path to your ROM file
        
        // Point this to your local EmulatorJS data directory or a public CDN hosting the WASM files
        EJS_pathtodata = 'https://jsdelivr.net'; 
    </script>
    <!-- Load the official EmulatorJS loader script -->
    <script src="https://jsdelivr.netloader.js"></script>

</body>
</html>
