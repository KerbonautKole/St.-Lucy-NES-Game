<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Lucy's NES Game</title>
    <script type="text/javascript" src="https://unpkg.com/jsnes@2/dist/jsnes.min.js"></script>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        #nes {
            width: 512px;
            height: 500px;
            margin: 0 auto;
            border: 4px solid #333;
            background: black;
        }
        .controls {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>St. Lucy's Home for Girls Raised by Wolves: The NES Game</h1>
    <div id="nes"></div>
    <div class="controls">
        <p><strong>Controls:</strong> Up, Down, Left, Right = Arrow Keys | Interact with Switches = X | Pause/Continue = Enter | Restart: Enter then press restart.</p>
    </div>
    <script>
        window.onload = function () {
            var browser = new jsnes.Browser({
                container: document.getElementById("nes"),
                onError: function (e) {
                    console.error("Emulator Error:", e);
                },
            });
            jsnes.Browser.loadROMFromURL("game.nes", function (err, data) {
                if (err) {
                    console.error("Failed to fetch ROM file:", err);
                    return;
                }
                browser.loadROM(data);
            });
        };
    </script>

</body>
</html>
