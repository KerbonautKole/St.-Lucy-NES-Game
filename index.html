<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Lucy's NES Game</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        /* Lock layout bounds cleanly */
        .game-wrapper {
            width: 640px;
            height: 480px;
            max-width: 100%;
            margin: 0 auto;
            border: 4px solid #333;
            background: black;
            position: relative;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>St. Lucy's Home for Girls Raised by Wolves: The NES Game</h1>
    
    <div class="game-wrapper">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        // Global variables MUST be declared before loading loader.js
        EJS_player = '#game';
        EJS_core = 'nes';
        EJS_gameUrl = 'game.nes'; // Ensure game.nes is in the exact same folder
        
        // Use the official updated EmulatorJS domain route
        EJS_pathtodata = 'https://emulatorjs.org'; 
    </script>
    
    <!-- Load the matching script from the exact same CDN host -->
    <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
