<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Lucy's NES Game</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        /* Lock layout bounds cleanly */
        .game-wrapper {
            width: 640px;
            height: 480px;
            max-width: 100%;
            margin: 0 auto;
            border: 4px solid #333;
            background: black;
            position: relative;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>St. Lucy's Home for Girls Raised by Wolves: The NES Game</h1>
    
    <div class="game-wrapper">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        try {
            // Helper function to dynamically modify and save settings objects
            function forceZeroOverscan(key) {
                let data = localStorage.getItem(key);
                data = data ? JSON.parse(data) : {};
                
                // Hardcode zero-mask parameters exactly how Nestopia reads them
                data["nestopia_overscan_v_top"] = "0";
                data["nestopia_overscan_v_bottom"] = "0";
                data["nestopia_overscan_h"] = "0";
                
                localStorage.setItem(key, JSON.stringify(data));
            }

            // Target BOTH core configuration keys discovered in step 5
            forceZeroOverscan("retroarch-options");
            forceZeroOverscan("ejs-1-nes-game.nes-settings");

        } catch (e) {
            console.error("Cache injection failed:", e);
        }

        // Global configuration variables 
        EJS_player = '#game';
        EJS_core = 'nestopia';
        EJS_gameUrl = 'game.nes'; 
        
        // Correct CDN data path (Requires a trailing slash)
        EJS_pathtodata = 'https://emulatorjs.org'; 
    </script>
    
    <!-- Correct script source URL -->
    <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
